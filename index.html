<!DOCTYPE html>
<html lang="uz">

<head>
<meta charset="UTF-8">
<title>Login 16</title>

<style>

body {
    font-family: Arial;
    background: #f2f2f2;
}

.box {
    width: 300px;
    margin: 80px auto;
    padding: 20px;
    background: white;
    border-radius: 10px;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 10px;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: blue;
    color: white;
    border: none;
}

</style>

</head>

<body>

<div class="box">

<h2>Login Form</h2>

<form method="POST">

<input type="text"
name="username"
placeholder="Username">

<input type="password"
name="password"
placeholder="Password">

<button type="submit">
Login
</button>

</form>

</div>

</body>
</html>
